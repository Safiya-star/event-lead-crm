<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #222;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background-color: white;
            border: 1px solid #e2e5e9;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        }

        .login-card h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .login-card p {
            margin: 0 0 24px;
            color: #666;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            margin-bottom: 18px;
            border: 1px solid #d7dce1;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            margin-bottom: 16px;
            padding: 10px;
            border-radius: 8px;
            background-color: #fdecec;
            color: #9b2c2c;
            font-size: 13px;
        }

        .login-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            margin-bottom: 14px;
            border-radius: 10px;
            background-color: #f0ebf8;
            color: #6f42c1;
            font-size: 18px;
        }

    </style>
</head>

<body>
    <body>
        <div class="login-card">

            <div class="login-icon">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h1>Admin Login</h1>
            <p>Sign in to access the Event Lead CRM dashboard.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
